[profile.default]
solc_version = "0.8.28"
evm_version = "cancun"
src = "src"
out = "out"
test = "test"
libs = ["lib"]
ffi = true
ast = true
build_info = true
optimizer = true
optimizer_runs = 200
via_ir = true
extra_output = ["storageLayout"]
cache_path = "cache_forge"
# Tests read the Go-generated fixtures in test/vectors.
fs_permissions = [{ access = "read", path = "./test/vectors" }]

[fmt]
# Vendored from the ZisK snark setup and kept as shipped: reformatting changes their
# metadata hash, and with it the runtime code script/verify_deployment.py compares.
ignore = ["src/verifiers/PlonkVerifier.sol", "src/verifiers/ZiskVerifier.sol"]

[fuzz]
runs = 5000
max_test_rejects = 150000

[rpc_endpoints]
localhost = "${LOCALHOST_RPC_URL}"
sepolia = "${SEPOLIA_RPC_URL}"
uzh = "${UZH_RPC_URL}"

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}" }

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
